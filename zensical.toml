[project]
site_name = "canopy-mcp"
site_url = "https://slaclab.github.io/canopy-mcp/"
site_author = "SLAC National Accelerator Laboratory - EED / Software Applications Group"
site_description = "Documentation for canopy-mcp, the MCP server for building, checking and showing Canopy screens."

repo_name = "slaclab/canopy-mcp"
repo_url = "https://github.com/slaclab/canopy-mcp"

nav = [
  { "Home" = "index.md" },
  { "How To" = [
    { "Overview" = "how_to/index.md" },
    { "Panel-builder skill" = "how_to/panel_builder_skill.md" },
    { "Library report" = "how_to/library_report.md" },
    { "Request a push" = "how_to/request_push.md" },
    { "Collections" = "how_to/collections.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.top",
  "navigation.tabs",
  "navigation.indexes",
  "navigation.footer",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

[project.plugins.mkdocstrings]
[project.plugins.mkdocstrings.config.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.config.handlers.python.options]
docstring_style = "numpy"
members_order = "source"
show_root_toc_entry = false
show_symbol_type_toc = true
merge_init_into_class = true

[project.plugins.mkdocstrings.config.handlers.python.options.docstring_options]
ignore_init_summary = true

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight = {}
pymdownx.superfences = {}
