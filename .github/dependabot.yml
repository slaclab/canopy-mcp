# Dependabot: watch for new GitHub Actions releases and open PRs that
# bump the pinned commit SHA (and the accompanying `# vX.Y.Z` comment),
# and for new releases of the Python dependencies in uv.lock.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
